<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Creative V6 Multi-framework</title>
  <desc id="desc">Capa monocromática da Base Creative V6 da ScR Community.</desc>
  <defs>
